services:
  localai:
    image: localai/localai:latest-gpu-vulkan
    container_name: localai
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      - /dev/dri/renderD127:/dev/dri/renderD127
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/renderD129:/dev/dri/renderD129
      - /dev/dri/renderD130:/dev/dri/renderD130
    volumes:
      - ./backends:/backends       # Waar LocalAI de C++ engines (llama.cpp, sd.cpp) opslaat
      - ./configuration:/configuration # Interne LocalAI configuraties en galleries
      - ./data:/data               # Vector databases, uploads, en RAG data (cruciaal voor later!)
      - ./models:/models
    environment:
      - DEBUG=true # Laat dit aan staan tot we bevestigd hebben dat Vulkan actief is
      - MODELS_PATH=/build/models
      
  # --- VULKAN & GPU (De basis) ---
      - LLAMACPP_VULKAN=1
      - STABLE_DIFFUSION_BACKEND=stablediffusion-cpp
      - STABLE_DIFFUSION_VULKAN=1
      
      # --- GLOBALE LLAMA.CPP CONFIGURATIE ---
      # Deze regels gelden nu voor ELK tekstmodel dat je laadt:
      - LLAMACPP_N_GPU_LAYERS=-1       # Laad ALTIJD alle lagen naar de GPU (geen CPU offload)
      - LLAMACPP_CONTEXT_SIZE=4096     # Standaard contextgrootte (veilig voor 16GB VRAM)
      - LLAMACPP_MMAP=true             # Geheugen-mappen voor efficiëntie
      - LLAMACPP_BATCH_SIZE=512        # Optimaliseert de verwerkingssnelheid
      
      # --- INTEL ARC SPECIFIEK ---
      - ZES_ENABLE_SYSMAN=1
      - OverrideGpuAddressSpace=48
      - ClDeviceGlobalMemSizeAvailablePercent=100
      
      # --- GEHEUGENBEHEER (Cruciaal voor 16GB VRAM) ---
      # Zorg dat de container niet zomaar al het systeemgeheugen opslokt
      - THREADS=4 # Beperk CPU threads voor pre/post-processing, houd de focus op de GPU
